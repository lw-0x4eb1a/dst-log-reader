# GitHub Actions CI —— 构建「饥荒日志阅读器」(Tauri 2 桌面应用)
#
# 构建平台：
#   - Windows 64 位   target: x86_64-pc-windows-msvc   产物: .msi (WiX) / .exe (NSIS)
#   - macOS Universal target: universal-apple-darwin   产物: .dmg / .app.tar.gz（Intel + Apple Silicon 二合一）
#
# 触发与发布：
#   - 任意 push（任意分支）：构建完成后自动创建一个 GitHub Release 并附上安装包，
#     无需手动打标签。标签由 "app 版本号 + 运行序号" 自动生成，例如 v0.1.0-build.42。
#   - workflow_dispatch：手动触发，同样会发布一个 Release。
#
# 如果只想在主分支上发布，把下面的 `push:` 改成：
#   push:
#     branches: [main]

name: Build & Release

on:
  push:
  workflow_dispatch:

# 同一分支上重复触发的运行自动取消，避免占用多个 runner
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # CI 上单次构建，增量编译没有收益反而占空间
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc
            artifact: dst-log-reader-windows-x64

          - name: macOS Universal
            os: macos-latest
            target: universal-apple-darwin
            # 通用二进制需先装好两个架构目标，构建时再由 lipo 合并
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
            artifact: dst-log-reader-macos-universal

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # 仓库根目录不是 cargo workspace，真正的 crate 在 src-tauri 下
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        # tauri build 会自动执行 tauri.conf.json 里的 beforeBuildCommand（npm run build）
        run: npm run tauri build -- ${{ matrix.args }}
        env:
          # 没有 Developer ID 证书时做 ad-hoc 签名，保证 Apple Silicon 上能直接运行
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.os, 'macos') && '-' || '' }}

      # .app 是带符号链接和可执行位的目录，直接当 artifact 上传会丢失权限，
      # 因此先打成 tar.gz 再上传
      - name: Package macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cd "src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          shopt -s nullglob
          apps=( *.app )
          if [ ${#apps[@]} -eq 0 ]; then
            echo "::error::未找到 .app 产物"
            exit 1
          fi
          for app in "${apps[@]}"; do
            tar -czf "${app}.tar.gz" "$app"
          done
          ls -lh

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.tar.gz

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 标签名取自 tauri.conf.json 的 version，配合 run_number 保证每次运行唯一
      - name: Resolve app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Download all bundles
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          # 自动创建标签时，指向本次构建的那个 commit
          target_commitish: ${{ github.sha }}
          draft: false
          generate_release_notes: true
          files: artifacts/**/*
